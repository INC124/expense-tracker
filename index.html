<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>記帳App</title><style>body{font-family:sans-serif;max-width:700px;margin:auto;padding:16px}input,select,button{width:100%;padding:10px;margin:6px 0}.card{border:1px solid #ddd;padding:12px;border-radius:8px;margin:10px 0}</style></head><body><h2>簡易記帳</h2><div class=card><input id=amt type=number placeholder=金額><select id=cat><option>飲食</option><option>交通</option><option>娛樂</option><option>生活</option><option>其他</option></select><input id=note placeholder=備註><button onclick=add()>新增支出</button></div><div class=card><h3>統計</h3><div id=stats></div></div><div class=card><h3>紀錄</h3><div id=list></div></div><script>let d=JSON.parse(localStorage.expenses||'[]');function add(){let a=+amt.value;if(!a)return;d.push({amt:a,cat:cat.value,note:note.value,date:new Date().toISOString()});localStorage.expenses=JSON.stringify(d);amt.value='';note.value='';render()}function render(){let t=new Date();let day=0,week=0,month=0;list.innerHTML='';d.slice().reverse().forEach(x=>{let dx=new Date(x.date);if(dx.toDateString()==t.toDateString())day+=x.amt;let diff=(t-dx)/86400000;if(diff<7)week+=x.amt;if(dx.getMonth()==t.getMonth()&&dx.getFullYear()==t.getFullYear())month+=x.amt;list.innerHTML+=`<div>${dx.toLocaleDateString()} ${x.cat} $${x.amt} ${x.note}</div>`});stats.innerHTML=`今日:${day}<br>本週:${week}<br>本月:${month}`;}render();</script></body></html>
